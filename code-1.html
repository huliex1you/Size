<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مصروفاتي</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:Tahoma, sans-serif; }
  body { background:#000; min-height:100vh; padding:30px 15px; color:#fff; text-align:center; }
  h1 { margin-bottom:5px; }
  .subtitle { color:#888; margin-bottom:30px; }

  .bubble-grid {
    display:flex; flex-wrap:wrap; gap:25px;
    justify-content:center; max-width:950px; margin:0 auto;
  }
  .bubble {
    width:130px; height:130px; border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; gap:6px;
    box-shadow:0 8px 25px rgba(0,0,0,.5);
    transition:transform .25s;
    position:relative;
  }
  .bubble:hover { transform:scale(1.1); }
  .bubble .icon { font-size:2.4em; }
  .bubble .label { font-size:.8em; font-weight:bold; padding:0 10px; }
  .bubble .count {
    position:absolute; top:10px; left:12px;
    background:rgba(0,0,0,.4); border-radius:50%;
    min-width:26px; height:26px; font-size:.75em;
    display:flex; align-items:center; justify-content:center;
  }

  .overlay {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,.85); z-index:100;
    align-items:center; justify-content:center;
  }
  .overlay.active { display:flex; }
  .panel {
    background:#111; border-radius:20px; padding:25px;
    width:92%; max-width:480px; max-height:80vh; overflow-y:auto;
    border:1px solid #333;
  }
  .item {
    display:flex; justify-content:space-between;
    background:#222; border-radius:12px;
    padding:13px 16px; margin-bottom:9px;
  }
  .item .amount { color:#fbbf24; font-weight:bold; }
  .close-btn {
    width:100%; padding:12px; border:none; border-radius:12px;
    background:#ef4444; color:#fff; font-weight:bold; cursor:pointer; margin-top:8px;
  }
</style>
</head>
<body>

<h1>💰 مصروفاتي</h1>
<p class="subtitle">اضغط على أي فقاعة لعرض تفاصيلها</p>

<div class="bubble-grid" id="grid"></div>

<div class="overlay" id="overlay">
  <div class="panel" id="panel"></div>
</div>

<script>
var groups = [
  {icon:"🏠", label:"السكن والمنزلية", color:"#2563eb",
   items:["إيجار / أقساط عقارية","كهرباء وماء","إنترنت واتصالات","غاز","صيانة المنزل","أثاث ومستلزمات"]},

  {icon:"🚗", label:"السيارة والمواصلات", color:"#ea580c",
   items:["وقود","تأمين السيارة","صيانة وإصلاحات","غسيل وعناية","إكسسوارات","مخالفات مرورية","مواقف","أوبر / كريم"]},

  {icon:"🛒", label:"المقاضي", color:"#16a34a",
   items:["مواد غذائية","لحوم ودواجن وأسماك","خضار وفواكه","مخبز وحلويات","منظفات","عناية شخصية"]},

  {icon:"👨‍👩‍👧‍👦", label:"الأسرة والأبناء", color:"#db2777",
   items:["رسوم مدرسية","قرطاسية","ملابس الأبناء","مصروف جيب","ترفيه عائلي","حضانة"]},

  {icon:"🏥", label:"الصحة", color:"#dc2626",
   items:["أدوية","تأمين طبي","عيادات وفحوصات","نادي رياضي","حلاقة / تجميل","فيتامينات","عطور"]},

  {icon:"🍔", label:"المطاعم والقهوة", color:"#d97706",
   items:["مطاعم","مقاهي","تطبيقات توصيل","وجبات سريعة","حلويات"]},

  {icon:"🛍️", label:"التسوق", color:"#9333ea",
   items:["ملابس رجالية","ملابس نسائية","أحذية وحقائب","إكسسوارات ومجوهرات","إلكترونيات"]},

  {icon:"✈️", label:"السفر والترفيه", color:"#0891b2",
   items:["تذاكر طيران","فنادق","أنشطة سياحية","تأشيرات","سينما وفعاليات","اشتراكات رقمية"]},

  {icon:"💸", label:"الديون", color:"#b91c1c",
   items:["قروض","بطاقات ائتمانية","جمعيات","سداد ديون","رسوم بنكية"]},

  {icon:"💰", label:"الادخار والاستثمار", color:"#15803d",
   items:["صندوق الطوارئ","ادخار للسفر","أسهم وصناديق","ذهب","ادخار الأبناء / تقاعد"]},

  {icon:"🕌", label:"الصدقات", color:"#059669",
   items:["زكاة مال","صدقات وتبرعات","كفالة أيتام","هدايا ومناسبات","مساعدة الأهل"]},

  {icon:"🎓", label:"التعليم والتطوير", color:"#4f46e5",
   items:["دورات تدريبية","كتب ومجلات","منصات تعليمية","استشارات"]},

  {icon:"🐾", label:"الحيوانات الأليفة", color:"#c026d3",
   items:["طعام الحيوانات","عيادة بيطرية","ألعاب وإكسسوارات","رعاية ونظافة"]}
];

var grid = document.getElementById("grid");

for (var i = 0; i < groups.length; i++) {
  var g = groups[i];
  var b = document.createElement("div");
  b.className = "bubble";
  b.style.background = g.color;
  b.innerHTML =
    '<div class="icon">' + g.icon + '</div>' +
    '<div class="label">' + g.label + '</div>' +
    '<div class="count">' + g.items.length + '</div>';
  b.setAttribute("data-index", i);
  b.onclick = function() { openPanel(groups[this.getAttribute("data-index")]); };
  grid.appendChild(b);
}

function openPanel(g) {
  var html = '<h2>' + g.icon + " " + g.label + '</h2><br>';
  for (var j = 0; j < g.items.length; j++) {
    html += '<div class="item"><span>' + g.items[j] + '</span><span class="amount">0 ر.س</span></div>';
  }
  html += '<button class="close-btn" onclick="closePanel()">إغلاق ✕</button>';
  document.getElementById("panel").innerHTML = html;
  document.getElementById("overlay").classList.add("active");
}

function closePanel() {
  document.getElementById("overlay").classList.remove("active");
}

document.getElementById("overlay").onclick = function(e) {
  if (e.target === this) closePanel();
};
</script>

</body>
</html>
